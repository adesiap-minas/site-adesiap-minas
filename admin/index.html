<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/admin/">
<title>Admin — ADESIAP Minas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1F33}
.login-box{background:#fff;border-radius:16px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo img{height:52px}
.login-logo h2{font-size:1.05rem;color:#12395D;margin-top:10px;font-weight:600}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
label{font-size:.78rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.95rem;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif}
input:focus{border-color:#12395D}
.btn-login{width:100%;margin-top:8px;padding:13px;background:#12395D;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s;font-family:'Inter',sans-serif}
.btn-login:hover{background:#1a4f82}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.erro{color:#e53e3e;font-size:.83rem;margin-top:12px;text-align:center;display:none;line-height:1.4}
.rodape{text-align:center;margin-top:24px;font-size:.75rem;color:#94a3b8}
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <img src="../img/logo.png" alt="ADESIAP Minas">
    <h2>Área Administrativa</h2>
  </div>

  <div class="form-group">
    <label>E-mail</label>
    <input type="email" id="emailInput" placeholder="seu@email.com" autocomplete="username">
  </div>
  <div class="form-group">
    <label>Senha</label>
    <input type="password" id="senhaInput" placeholder="••••••••" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')fazerLogin()">
  </div>

  <button class="btn-login" id="btnLogin" onclick="fazerLogin()">Entrar</button>
  <div class="erro" id="loginError"></div>

  <div class="rodape">ADESIAP Minas &copy; 2025</div>
</div>

<script>window.PERFIS_PERMITIDOS = null;</script>
<script src="auth.js"></script>
</body>
</html>
